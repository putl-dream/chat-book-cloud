server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=30s;
    client_max_body_size 10m;

    set $minio_proxy_target ${MINIO_PROXY_TARGET};
    set $gateway_proxy_target ${GATEWAY_PROXY_TARGET};
    set $auth_proxy_target ${AUTH_PROXY_TARGET};
    set $forwarded_proto $scheme;
    set $forwarded_host $host;
    set $forwarded_port $server_port;

    if ($http_x_forwarded_proto != "") {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    if ($http_x_forwarded_host != "") {
        set $forwarded_host $http_x_forwarded_host;
    }

    if ($http_x_forwarded_port != "") {
        set $forwarded_port $http_x_forwarded_port;
    }

    # 开启 Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json image/svg+xml;
    gzip_vary on;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由支持 (SPA Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 文件桶代理
    location ~ ^/(chat-book-images|chat-book-files)/ {
        proxy_pass $minio_proxy_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API 和 WebSocket 统一走 Gateway
    location /api/ {
        proxy_pass $gateway_proxy_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 增加缓冲和超时配置，防止 502
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # OAuth 授权入口与第三方登录回调直接转发到认证服务
    location /oauth2/ {
        proxy_pass $auth_proxy_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    location /login/oauth2/ {
        proxy_pass $auth_proxy_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
