spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  main:
    allow-bean-definition-overriding: true
  codec:
    max-in-memory-size: -1
  cloud:
    # Spring Cloud Gateway 配置项，对应 GatewayProperties 类
    gateway:
      globalcors:
        cors-configurations:
          "[/**]": # 允许跨域的请求
            allowedOriginPatterns: # 使用模式匹配允许的源
              - "http://*"
              - "https://*"
              - "ws://*"
            allowedMethods: # 支持的请求方法
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*" # 允许所有请求头
            allowCredentials: true # 允许携带凭证（如 cookies）
            max-age: 3600
        add-to-simple-url-handler-mapping: true
      default-filters:
      routes:
        # ==================== 统一前缀路由配置 ====================
        # 格式规范: /api/{service-name}/* → StripPrefix=1
        # 路由规则: Path=/api/xxx/** → 裁剪后传递 /xxx/** 给下游服务

        # 认证服务 - /api/auth/**
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:lb://chat-book-cloud-auth}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                redis-rate-limiter.requestedTokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

        # 文章服务核心业务 - /api/article/**, /api/page/**, /api/author-tag/**, /api/system-tag/**, /api/tag-map/**
        - id: article-service
          uri: ${ARTICLE_SERVICE_URI:lb://chat-book-cloud-article}
          predicates:
            - Path=/api/article/**,/api/page/**,/api/tag/**,/api/author-tag/**,/api/system-tag/**,/api/tag-map/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                redis-rate-limiter.requestedTokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

        # 文章静态资源服务 - /api/file/**, /api/images/**, /api/videos/**
        - id: article-service-static
          uri: ${ARTICLE_SERVICE_URI:lb://chat-book-cloud-article}
          predicates:
            - Path=/api/file/**,/api/images/**,/api/videos/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                redis-rate-limiter.requestedTokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}
            - RewritePath=/api/file/(?<segment>.*),/article/file/$\{segment}

        # 用户服务 - /api/user/**
        - id: user-service
          uri: ${USER_SERVICE_URI:lb://chat-book-cloud-user}
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                redis-rate-limiter.requestedTokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

        # 聊天服务 - /api/chat/**
        - id: chat-service
          uri: ${CHAT_SERVICE_URI:lb://chat-book-cloud-chat}
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                redis-rate-limiter.requestedTokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

        # Agent 服务 - /api/agent/**
        - id: agent-service
          uri: ${AGENT_SERVICE_URI:lb://chat-book-cloud-agent}
          predicates:
            - Path=/api/agent/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                redis-rate-limiter.requestedTokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

        # 互动服务 - /api/interaction/**
        - id: interaction-service
          uri: ${INTERACTION_SERVICE_URI:lb://chat-book-cloud-interaction}
          predicates:
            - Path=/api/interaction/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                redis-rate-limiter.requestedTokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

        # 社交服务 - /api/social/**
        - id: social-service
          uri: ${SOCIAL_SERVICE_URI:lb://chat-book-cloud-social}
          predicates:
            - Path=/api/social/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                redis-rate-limiter.requestedTokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

        # ==================== WebSocket 路由配置 ====================
        # Article 服务 WebSocket
        - id: article-service-websocket
          order: -10
          uri: ${ARTICLE_SERVICE_WS_URI:lb:ws://chat-book-cloud-article}
          predicates:
            - Path=/api/article/ws
          filters:
            - StripPrefix=1

        # Chat 服务 WebSocket
        - id: chat-service-websocket
          order: -10
          uri: ${CHAT_SERVICE_WS_URI:lb:ws://chat-book-cloud-chat}
          predicates:
            - Path=/api/chat/ws
          filters:
            - StripPrefix=1

        # Agent 服务 WebSocket
        - id: agent-service-websocket
          order: -10
          uri: ${AGENT_SERVICE_WS_URI:lb:ws://chat-book-cloud-agent}
          predicates:
            - Path=/api/agent/ws
          filters:
            - StripPrefix=1

authentication:
  rules:
    - name: user-self-api
      pattern: /api/user/bySelf
    - name: user-update-api
      pattern: /api/user/update
    - name: user-history-page-api
      pattern: /api/page/userHistoryPage
    - name: user-collect-page-api
      pattern: /api/page/userCollectPage
    - name: user-article-page-api
      pattern: /api/page/userArticlePage
    - name: user-draft-page-api
      pattern: /api/page/userDraftArticlePage
    - name: social-api
      pattern: /api/social/**
    - name: chat-history-api
      pattern: /api/chat/messages
    - name: chat-unread-api
      pattern: /api/chat/unread/count
    - name: chat-read-api
      pattern: /api/chat/messages/read
    - name: agent-api
      pattern: /api/agent/**
    - name: interaction-praise-api
      pattern: /api/interaction/foot/praise
    - name: interaction-collection-api
      pattern: /api/interaction/foot/collection
    - name: interaction-comment-api
      pattern: /api/interaction/foot/comment
    - name: interaction-history-api
      pattern: /api/interaction/foot/getHistory
    - name: interaction-notification-api
      pattern: /api/interaction/foot/getNotifications
    - name: admin-user-api
      pattern: /api/user/admin/**
    - name: admin-review-page-api
      pattern: /api/page/adminArticlePage
    - name: admin-article-review-action-api
      pattern: /api/article/admin/**
    - name: admin-author-tag-api
      pattern: /api/author-tag/admin/**
    - name: admin-system-tag-api
      pattern: /api/system-tag/**
    - name: admin-tag-map-api
      pattern: /api/tag-map/**
    - name: admin-review-api
      pattern: /api/interaction/admin/review/**
