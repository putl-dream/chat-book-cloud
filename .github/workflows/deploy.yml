name: CI and Deploy

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  java-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FILE_STORAGE_BASE_URL: ${{ vars.FILE_STORAGE_BASE_URL || '' }}
      MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT || 'http://localhost:9000' }}
      MINIO_ACCESS_KEY: ${{ vars.MINIO_ACCESS_KEY || 'admin' }}
      MINIO_SECRET_KEY: ${{ vars.MINIO_SECRET_KEY || 'admin@2026' }}
      MINIO_BUCKET: ${{ vars.MINIO_BUCKET || 'chat-book-images' }}
      MINIO_PUBLIC_URL: ${{ vars.MINIO_PUBLIC_URL || 'http://localhost:9000' }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin@2026
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Start MinIO
        run: |
          set -euo pipefail

          docker run -d -p 9000:9000 -p 9001:9001 --name minio \
            -e MINIO_ROOT_USER=admin -e MINIO_ROOT_PASSWORD=admin@2026 \
            quay.io/minio/minio:latest server /data --console-address ":9001"

          echo "Waiting for MinIO..."
          timeout=60
          until curl --fail --silent http://localhost:9000/minio/health/live > /dev/null; do
            timeout=$((timeout - 1))
            if [ "${timeout}" -eq 0 ]; then
              echo "MinIO startup timed out"
              exit 1
            fi
            sleep 1
          done
          echo "MinIO is up!"

      - name: Initialize databases
        run: |
          set -euo pipefail

          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS \`chat_book_auth\`; CREATE DATABASE IF NOT EXISTS \`chat_book_user\`; CREATE DATABASE IF NOT EXISTS \`chat_book_article\`; CREATE DATABASE IF NOT EXISTS \`chat_book_interaction\`; CREATE DATABASE IF NOT EXISTS \`chat_book_social\`;"
          mysql -h 127.0.0.1 -u root -proot -e "USE chat_book_user; CREATE TABLE IF NOT EXISTS user_foot (id INT AUTO_INCREMENT PRIMARY KEY, user_id INT, document_id INT, document_type INT, document_user_id INT, collection_stat INT, read_stat INT, comment_stat INT, praise_stat INT, create_time DATETIME, update_time DATETIME); CREATE TABLE IF NOT EXISTS review (id INT AUTO_INCREMENT PRIMARY KEY, text_id INT, user_id INT, parent_id INT, content TEXT, create_time DATETIME, update_time DATETIME);"

      - name: Run Maven tests
        run: mvn -B -ntp test --file pom.xml

  build-and-deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-master
      cancel-in-progress: false
    env:
      FILE_STORAGE_BASE_URL: ${{ vars.FILE_STORAGE_BASE_URL || '' }}
      VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL || '' }}
      MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT || '' }}
      MINIO_ACCESS_KEY: ${{ vars.MINIO_ACCESS_KEY || '' }}
      MINIO_SECRET_KEY: ${{ vars.MINIO_SECRET_KEY || '' }}
      MINIO_BUCKET: ${{ vars.MINIO_BUCKET || '' }}
      MINIO_PUBLIC_URL: ${{ vars.MINIO_PUBLIC_URL || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build backend with Maven
        run: mvn -B -ntp clean package -DskipTests --file pom.xml

      - name: Set up Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: chat-book-ui-blog/package-lock.json

      - name: Install frontend dependencies
        working-directory: chat-book-ui-blog
        run: npm ci

      - name: Build frontend
        working-directory: chat-book-ui-blog
        run: npm run build

      - name: Prepare deployment artifacts
        run: |
          set -euo pipefail

          mkdir -p deploy/chat-book-cloud-gateway/target
          mkdir -p deploy/chat-book-cloud-auth/target
          mkdir -p deploy/chat-book-cloud-user/target
          mkdir -p deploy/chat-book-cloud-article/target
          mkdir -p deploy/chat-book-cloud-interaction/target
          mkdir -p deploy/chat-book-cloud-social/target
          mkdir -p deploy/chat-book-cloud-chat/target
          mkdir -p deploy/chat-book-ui-blog/dist

          cp chat-book-cloud-gateway/target/*.jar deploy/chat-book-cloud-gateway/target/
          cp chat-book-cloud-auth/target/*.jar deploy/chat-book-cloud-auth/target/
          cp chat-book-cloud-user/target/*.jar deploy/chat-book-cloud-user/target/
          cp chat-book-cloud-article/target/*.jar deploy/chat-book-cloud-article/target/
          cp chat-book-cloud-interaction/target/*.jar deploy/chat-book-cloud-interaction/target/
          cp chat-book-cloud-social/target/*.jar deploy/chat-book-cloud-social/target/
          cp chat-book-cloud-chat/target/*.jar deploy/chat-book-cloud-chat/target/

          cp chat-book-cloud-gateway/Dockerfile deploy/chat-book-cloud-gateway/
          cp chat-book-cloud-auth/Dockerfile deploy/chat-book-cloud-auth/
          cp chat-book-cloud-user/Dockerfile deploy/chat-book-cloud-user/
          cp chat-book-cloud-article/Dockerfile deploy/chat-book-cloud-article/
          cp chat-book-cloud-interaction/Dockerfile deploy/chat-book-cloud-interaction/
          cp chat-book-cloud-social/Dockerfile deploy/chat-book-cloud-social/
          cp chat-book-cloud-chat/Dockerfile deploy/chat-book-cloud-chat/
          cp chat-book-ui-blog/Dockerfile deploy/chat-book-ui-blog/

          cp chat-book-ui-blog/nginx.conf deploy/chat-book-ui-blog/
          cp -r chat-book-ui-blog/dist/* deploy/chat-book-ui-blog/dist/

          cp docker-compose.yml deploy/

      - name: Copy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "deploy/*"
          target: "/home/${{ secrets.SERVER_USER }}/chat-book-cloud/"
          strip_components: 1

      - name: Start services via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -eu
            cd /home/${{ secrets.SERVER_USER }}/chat-book-cloud/
            if docker compose version > /dev/null 2>&1; then
              docker compose up -d --build --remove-orphans
            else
              docker-compose up -d --build --remove-orphans
            fi
            docker image prune -f
