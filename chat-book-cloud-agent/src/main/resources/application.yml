spring:
  config:
    import: optional:nacos:agent-service-${spring.profiles.active}.yml
  cloud:
    circuitbreaker:
      bulkhead:
        resilience4j:
          enabled: true
      resilience4j:
        enableSemaphoreDefaultBulkhead: true
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 3000

resilience4j:
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: ${RESILIENCE4J_BULKHEAD_MAX_CONCURRENT_CALLS:32}
        maxWaitDuration: 0
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: true
  setting:
    language: zh_cn

websocket:
  path: /agent/ws

agent:
  chat:
    recent-window-size: ${AGENT_CHAT_RECENT_WINDOW_SIZE:12}
    recent-window-ttl-minutes: ${AGENT_CHAT_RECENT_WINDOW_TTL_MINUTES:30}
    notebook-ttl-minutes: ${AGENT_CHAT_NOTEBOOK_TTL_MINUTES:120}
    stream-timeout-ms: ${AGENT_CHAT_STREAM_TIMEOUT_MS:60000}
    stream-executor-core-pool-size: ${AGENT_CHAT_STREAM_EXECUTOR_CORE_POOL_SIZE:4}
    stream-executor-max-pool-size: ${AGENT_CHAT_STREAM_EXECUTOR_MAX_POOL_SIZE:16}
    stream-executor-queue-capacity: ${AGENT_CHAT_STREAM_EXECUTOR_QUEUE_CAPACITY:200}
  ai:
    provider: ${AGENT_AI_PROVIDER:anthropic}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.minimaxi.com/anthropic}
      timeout-ms: ${ANTHROPIC_TIMEOUT_MS:300000}
      model:
        chat: ${ANTHROPIC_CHAT_MODEL:MiniMax-M2.7}
        generate: ${ANTHROPIC_GENERATE_MODEL:MiniMax-M2.7}
        optimize: ${ANTHROPIC_OPTIMIZE_MODEL:MiniMax-M2.7}
        notebook: ${ANTHROPIC_NOTEBOOK_MODEL:MiniMax-M2.7}
      max-tokens:
        chat: ${ANTHROPIC_CHAT_MAX_TOKENS:30000}
        generate: ${ANTHROPIC_GENERATE_MAX_TOKENS:30000}
        optimize: ${ANTHROPIC_OPTIMIZE_MAX_TOKENS:30000}
        notebook: ${ANTHROPIC_NOTEBOOK_MAX_TOKENS:30000}
    codex:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      timeout-ms: ${OPENAI_TIMEOUT_MS:300000}
      reasoning-effort: ${OPENAI_REASONING_EFFORT:}
      store: ${OPENAI_STORE:false}
      model:
        chat: ${OPENAI_CHAT_MODEL:gpt-5.2}
        generate: ${OPENAI_GENERATE_MODEL:gpt-5.2}
        optimize: ${OPENAI_OPTIMIZE_MODEL:gpt-5.2}
        notebook: ${OPENAI_NOTEBOOK_MODEL:gpt-5.2}
      max-tokens:
        chat: ${OPENAI_CHAT_MAX_TOKENS:30000}
        generate: ${OPENAI_GENERATE_MAX_TOKENS:30000}
        optimize: ${OPENAI_OPTIMIZE_MAX_TOKENS:30000}
        notebook: ${OPENAI_NOTEBOOK_MAX_TOKENS:30000}
