services:
  gateway:
    image: chat-book-cloud-gateway:dev
    container_name: gateway
    restart: always
    build: ./chat-book-cloud-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
    networks:
      - chat-book-net

  auth:
    image: chat-book-cloud-auth:dev
    container_name: auth
    restart: always
    build: ./chat-book-cloud-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-10.0.0.2}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-10.0.0.2}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin@2026}
      OAUTH2_SUCCESS_REDIRECT_URL: ${OAUTH2_SUCCESS_REDIRECT_URL:-http://180.184.30.1/login}
    networks:
      - chat-book-net

  user:
    image: chat-book-cloud-user:dev
    container_name: user
    restart: always
    build: ./chat-book-cloud-user
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-10.0.0.2}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-10.0.0.2}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin@2026}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://10.0.0.2:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin@2026}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://49.235.53.56:9000}
    networks:
      - chat-book-net

  article:
    image: chat-book-cloud-article:dev
    container_name: article
    restart: always
    build: ./chat-book-cloud-article
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-10.0.0.2}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-10.0.0.2}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin@2026}
      FILE_STORAGE_BASE_URL: ${FILE_STORAGE_BASE_URL:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://10.0.0.2:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin@2026}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://49.235.53.56:9000}
    networks:
      - chat-book-net

  interaction:
    image: chat-book-cloud-interaction:dev
    container_name: interaction
    restart: always
    build: ./chat-book-cloud-interaction
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://10.0.0.2:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin@2026}
      MINIO_BUCKET: ${MINIO_BUCKET:-chat-book-images}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://49.235.53.56:9000}
    networks:
      - chat-book-net

  social:
    image: chat-book-cloud-social:dev
    container_name: social
    restart: always
    build: ./chat-book-cloud-social
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    networks:
      - chat-book-net

  chat:
    image: chat-book-cloud-chat:dev
    container_name: chat
    restart: always
    build: ./chat-book-cloud-chat
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    networks:
      - chat-book-net

  frontend:
    image: chat-book-ui-blog:dev
    container_name: frontend
    restart: always
    build: ./chat-book-ui-blog
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - chat-book-net

networks:
  chat-book-net:
    driver: bridge
