services:
  gateway:
    image: chat-book-cloud-gateway:dev
    container_name: gateway
    restart: always
    build: ./chat-book-cloud-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${NACOS_REGISTER_IP:-10.0.0.1}
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: 8080
      AUTH_SERVICE_URI: http://auth:8081
      ARTICLE_SERVICE_URI: http://article:8082
      USER_SERVICE_URI: http://user:8083
      CHAT_SERVICE_URI: http://chat:8085
      INTERACTION_SERVICE_URI: http://interaction:8084
      SOCIAL_SERVICE_URI: http://social:8086
    networks:
      - chat-book-net

  auth:
    image: chat-book-cloud-auth:dev
    container_name: auth
    restart: always
    build: ./chat-book-cloud-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${NACOS_REGISTER_IP:-10.0.0.1}
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: 8081
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-10.0.0.2}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-10.0.0.2}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin@2026}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required for auth oauth2 login}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required for auth oauth2 login}
      OAUTH2_SUCCESS_REDIRECT_URL: ${OAUTH2_SUCCESS_REDIRECT_URL:-http://180.184.30.1/login}
    networks:
      - chat-book-net

  agent:
    image: chat-book-cloud-agent:dev
    container_name: agent
    restart: always
    build: ./chat-book-cloud-agent
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${NACOS_REGISTER_IP:-10.0.0.1}
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: 8087
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-10.0.0.2}
      REDIS_PORT: ${REDIS_PORT:-6379}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
    networks:
      - chat-book-net

  user:
    image: chat-book-cloud-user:dev
    container_name: user
    restart: always
    build: ./chat-book-cloud-user
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${NACOS_REGISTER_IP:-10.0.0.1}
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: 8083
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-10.0.0.2}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-10.0.0.2}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin@2026}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://10.0.0.2:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin@2026}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://49.235.53.56:9000}
    networks:
      - chat-book-net

  article:
    image: chat-book-cloud-article:dev
    container_name: article
    restart: always
    build: ./chat-book-cloud-article
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${NACOS_REGISTER_IP:-10.0.0.1}
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: 8082
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: ${REDIS_HOST:-10.0.0.2}
      REDIS_PORT: ${REDIS_PORT:-6379}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-10.0.0.2}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin@2026}
      FILE_STORAGE_BASE_URL: ${FILE_STORAGE_BASE_URL:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://10.0.0.2:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin@2026}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://49.235.53.56:9000}
    networks:
      - chat-book-net

  interaction:
    image: chat-book-cloud-interaction:dev
    container_name: interaction
    restart: always
    build: ./chat-book-cloud-interaction
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${NACOS_REGISTER_IP:-10.0.0.1}
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: 8084
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://10.0.0.2:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin@2026}
      MINIO_BUCKET: ${MINIO_BUCKET:-chat-book-images}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://49.235.53.56:9000}
    networks:
      - chat-book-net

  social:
    image: chat-book-cloud-social:dev
    container_name: social
    restart: always
    build: ./chat-book-cloud-social
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${NACOS_REGISTER_IP:-10.0.0.1}
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: 8086
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    networks:
      - chat-book-net

  chat:
    image: chat-book-cloud-chat:dev
    container_name: chat
    restart: always
    build: ./chat-book-cloud-chat
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-10.0.0.2:8848}
      SPRING_CLOUD_NACOS_DISCOVERY_IP: ${NACOS_REGISTER_IP:-10.0.0.1}
      SPRING_CLOUD_NACOS_DISCOVERY_PORT: 8085
      MYSQL_HOST: ${MYSQL_HOST:-10.0.0.2}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    networks:
      - chat-book-net

  frontend:
    image: chat-book-ui-blog:dev
    container_name: frontend
    restart: always
    build: ./chat-book-ui-blog
    ports:
      - "80:80"
    environment:
      GATEWAY_PROXY_TARGET: http://gateway:8080
      MINIO_PROXY_TARGET: ${MINIO_PROXY_TARGET:-http://10.0.0.2:9000}
    depends_on:
      - gateway
    networks:
      - chat-book-net

networks:
  chat-book-net:
    driver: bridge
