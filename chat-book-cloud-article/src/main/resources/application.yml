spring:
  config:
    import: optional:nacos:article-service-${spring.profiles.active}.yml
  cloud:
    circuitbreaker:
      bulkhead:
        resilience4j:
          enabled: true
      resilience4j:
        enableSemaphoreDefaultBulkhead: true
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 3000

resilience4j:
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: ${RESILIENCE4J_BULKHEAD_MAX_CONCURRENT_CALLS:32}
        maxWaitDuration: 0
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 4s
        cancelRunningFuture: true

file:
  storage:
    base-url: ${FILE_STORAGE_BASE_URL:}

websocket:
  path: /article/ws
